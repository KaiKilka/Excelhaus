<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Trip 2025 – Live-Ergebnisse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0d0d1a;
    color: #fff;
    min-height: 100vh;
    padding: 24px 20px 48px;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .logo {
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(90deg, #ff8c00, #8c52e8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .tagline { color: #888; font-size: 0.9rem; }

  .counter-row { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
  .counter-chip { background: #181828; border-radius: 50px; padding: 10px 20px; font-size: 1rem; font-weight: 700; border: 2px solid #2a2a3a; }
  .counter-chip span { color: #ff8c00; }
  .counter-chip.m span { color: #4fc3f7; }
  .counter-chip.f span { color: #f48fb1; }

  .winner-banner {
    background: #181828;
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    margin-bottom: 24px;
    border: 2px solid #2a2a3a;
    transition: border-color 0.4s;
  }
  .winner-banner.lis { border-color: #ff8c00; }
  .winner-banner.sof { border-color: #8c52e8; }
  .winner-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 8px; }
  .winner-name { font-size: 2.2rem; font-weight: 800; margin-bottom: 12px; }
  .winner-name.lis { color: #ff8c00; }
  .winner-name.sof { color: #8c52e8; }
  .scores-row { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .score-pill { padding: 10px 20px; border-radius: 50px; font-size: 1.05rem; font-weight: 700; }
  .score-pill.lis { background: rgba(255,140,0,0.15); color: #ff8c00; border: 1px solid #ff8c00; }
  .score-pill.sof { background: rgba(140,82,232,0.15); color: #8c52e8; border: 1px solid #8c52e8; }

  .gender-winners { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .gw-card { background: #181828; border-radius: 16px; padding: 16px; text-align: center; border: 1px solid #2a2a3a; }
  .gw-label { font-size: 0.75rem; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .gw-icon { font-size: 1.4rem; margin-bottom: 4px; }
  .gw-winner { font-size: 1rem; font-weight: 700; }
  .gw-winner.lis { color: #ff8c00; }
  .gw-winner.sof { color: #8c52e8; }
  .gw-score { font-size: 0.8rem; color: #888; margin-top: 2px; }

  .section-title {
    font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; color: #ccc;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: #2a2a3a; }

  .gender-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    padding: 8px 16px; border-radius: 8px; border: 2px solid #2a2a3a;
    background: #181828; color: #aaa; cursor: pointer; font-size: 0.85rem;
    font-weight: 600; transition: all 0.2s;
  }
  .tab-btn.active { border-color: #ff8c00; color: #fff; background: rgba(255,140,0,0.1); }

  .criteria-grid { display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px; }
  .criterion-card { background: #181828; border-radius: 16px; padding: 18px 20px; border: 1px solid #2a2a3a; }
  .criterion-name { font-size: 1rem; font-weight: 600; margin-bottom: 14px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-city { width: 110px; flex-shrink: 0; font-size: 0.82rem; color: #ccc; }
  .bar-wrap { flex: 1; height: 22px; background: #22223a; border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width 0.6s cubic-bezier(.4,0,.2,1); min-width: 2px; }
  .bar-fill.lis { background: linear-gradient(90deg, #ff8c00, #ff6000); }
  .bar-fill.sof { background: linear-gradient(90deg, #8c52e8, #5a2ea0); }
  .bar-val { width: 32px; flex-shrink: 0; text-align: right; font-size: 0.85rem; font-weight: 600; }
  .bar-val.lis { color: #ff8c00; }
  .bar-val.sof { color: #8c52e8; }

  .live-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #2ecc71;
    margin-right: 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .error-banner { background: #2a1010; border: 1px solid #c0392b; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; font-size: 0.88rem; color: #e74c3c; line-height: 1.5; }

  @media (min-width: 700px) {
    .criteria-grid { display: grid; grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="logo">🎃 HALLOWEEN 2025 — <span class="live-dot"></span>LIVE</div>
  <div class="tagline">Echtzeit-Abstimmung · Lissabon 🇵🇹 vs. Sofia 🇧🇬</div>
</div>

<div id="errorBanner" style="display:none" class="error-banner"></div>

<div class="counter-row">
  <div class="counter-chip">👥 Teilnehmer: <span id="totalCount">0</span></div>
  <div class="counter-chip m">👨 Männlich: <span id="mCount">0</span></div>
  <div class="counter-chip f">👩 Weiblich: <span id="fCount">0</span></div>
</div>

<div class="winner-banner" id="winnerBanner">
  <div class="winner-label">🏆 Gesamtsieger</div>
  <div class="winner-name" id="winnerName">—</div>
  <div class="scores-row">
    <div class="score-pill lis" id="lisScore">🇵🇹 —</div>
    <div class="score-pill sof" id="sofScore">🇧🇬 —</div>
  </div>
</div>

<div class="gender-winners">
  <div class="gw-card">
    <div class="gw-label">Männer wählen</div>
    <div class="gw-icon">👨</div>
    <div class="gw-winner" id="mWinner">—</div>
    <div class="gw-score" id="mWinnerScore">Noch keine Stimmen</div>
  </div>
  <div class="gw-card">
    <div class="gw-label">Frauen wählen</div>
    <div class="gw-icon">👩</div>
    <div class="gw-winner" id="fWinner">—</div>
    <div class="gw-score" id="fWinnerScore">Noch keine Stimmen</div>
  </div>
</div>

<div class="section-title">📊 Bewertung je Kriterium</div>
<div class="gender-tabs">
  <button class="tab-btn active" onclick="setTab('all')" id="tab-all">Alle</button>
  <button class="tab-btn" onclick="setTab('maennlich')" id="tab-maennlich">👨 Männlich</button>
  <button class="tab-btn" onclick="setTab('weiblich')" id="tab-weiblich">👩 Weiblich</button>
</div>
<div class="criteria-grid" id="criteriaGrid"></div>

<script>
const CRITERIA = [
  { id: 'wetter',    label: '🌡 Wetter' },
  { id: 'flug',      label: '✈ Flug & Erreichbarkeit' },
  { id: 'halloween', label: '🎃 Halloween-Atmosphäre' },
  { id: 'nightlife', label: '🍺 Nightlife & Bars' },
  { id: 'preis',     label: '💰 Preis-Leistung' },
  { id: 'sehensw',   label: '🏙 Sehenswürdigkeiten' },
  { id: 'essen',     label: '🍳 Essen & Trinken' },
  { id: 'unterkunft',label: '🏠 Unterkunft' },
];

let currentTab = 'all';
let allVotes = [];

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  renderResults();
}

function computeResults(votes) {
  const byGender = { maennlich: [], weiblich: [] };
  votes.forEach(v => {
    if (v.gender === 'maennlich') byGender.maennlich.push(v);
    else if (v.gender === 'weiblich') byGender.weiblich.push(v);
  });

  function avgForGroup(group) {
    const out = {};
    CRITERIA.forEach(c => {
      const lisVals = group.map(v => v.ratings?.[c.id]?.lissabon).filter(x => x > 0);
      const sofVals = group.map(v => v.ratings?.[c.id]?.sofia).filter(x => x > 0);
      out[c.id] = {
        lissabon: lisVals.length ? lisVals.reduce((a,b)=>a+b,0)/lisVals.length : 0,
        sofia:    sofVals.length ? sofVals.reduce((a,b)=>a+b,0)/sofVals.length : 0,
      };
    });
    return out;
  }

  function overallAvg(group) {
    const avg = avgForGroup(group);
    const lisAll = CRITERIA.map(c => avg[c.id].lissabon).filter(x=>x>0);
    const sofAll = CRITERIA.map(c => avg[c.id].sofia).filter(x=>x>0);
    return {
      lissabon: lisAll.length ? lisAll.reduce((a,b)=>a+b,0)/lisAll.length : 0,
      sofia:    sofAll.length ? sofAll.reduce((a,b)=>a+b,0)/sofAll.length : 0,
    };
  }

  return {
    total: votes.length,
    genderCount: { maennlich: byGender.maennlich.length, weiblich: byGender.weiblich.length },
    all: avgForGroup(votes),
    byGender: { maennlich: avgForGroup(byGender.maennlich), weiblich: avgForGroup(byGender.weiblich) },
    overall: overallAvg(votes),
    overallByGender: { maennlich: overallAvg(byGender.maennlich), weiblich: overallAvg(byGender.weiblich) },
  };
}

function renderResults() {
  const data = computeResults(allVotes);
  const { total, genderCount, all, byGender, overall, overallByGender } = data;

  document.getElementById('totalCount').textContent = total;
  document.getElementById('mCount').textContent = genderCount.maennlich;
  document.getElementById('fCount').textContent = genderCount.weiblich;

  // Overall winner
  const lisO = overall.lissabon, sofO = overall.sofia;
  const winner = total === 0 ? null : (lisO >= sofO ? 'lissabon' : 'sofia');
  const banner = document.getElementById('winnerBanner');
  banner.className = 'winner-banner' + (winner === 'lissabon' ? ' lis' : winner === 'sofia' ? ' sof' : '');
  const wn = document.getElementById('winnerName');
  wn.className = 'winner-name' + (winner === 'lissabon' ? ' lis' : winner === 'sofia' ? ' sof' : '');
  wn.textContent = total === 0 ? '—' : (winner === 'lissabon' ? '🇵🇹 Lissabon' : '🇧🇬 Sofia');
  document.getElementById('lisScore').textContent = '🇵🇹 ' + (lisO > 0 ? lisO.toFixed(2) + ' / 5' : '—');
  document.getElementById('sofScore').textContent = '🇧🇬 ' + (sofO > 0 ? sofO.toFixed(2) + ' / 5' : '—');

  function setGW(nameId, scoreId, l, s, count) {
    const nameEl = document.getElementById(nameId);
    const scoreEl = document.getElementById(scoreId);
    if (count === 0) { nameEl.textContent = '—'; nameEl.className = 'gw-winner'; scoreEl.textContent = 'Noch keine Stimmen'; return; }
    const w = l >= s ? 'lissabon' : 'sofia';
    nameEl.className = 'gw-winner ' + (w === 'lissabon' ? 'lis' : 'sof');
    nameEl.textContent = w === 'lissabon' ? '🇵🇹 Lissabon' : '🇧🇬 Sofia';
    scoreEl.textContent = `Lis: ${l.toFixed(2)} · Sof: ${s.toFixed(2)}`;
  }
  setGW('mWinner','mWinnerScore', overallByGender.maennlich.lissabon, overallByGender.maennlich.sofia, genderCount.maennlich);
  setGW('fWinner','fWinnerScore', overallByGender.weiblich.lissabon,  overallByGender.weiblich.sofia,  genderCount.weiblich);

  // Criteria bars
  const ratingsData = currentTab === 'all' ? all : byGender[currentTab];
  document.getElementById('criteriaGrid').innerHTML = CRITERIA.map(c => {
    const r = ratingsData[c.id] || { lissabon: 0, sofia: 0 };
    return `
      <div class="criterion-card">
        <div class="criterion-name">${c.label}</div>
        <div class="bar-row">
          <div class="bar-city">🇵🇹 Lissabon</div>
          <div class="bar-wrap"><div class="bar-fill lis" style="width:${(r.lissabon/5)*100}%"></div></div>
          <div class="bar-val lis">${r.lissabon > 0 ? r.lissabon.toFixed(1) : '—'}</div>
        </div>
        <div class="bar-row">
          <div class="bar-city">🇧🇬 Sofia</div>
          <div class="bar-wrap"><div class="bar-fill sof" style="width:${(r.sofia/5)*100}%"></div></div>
          <div class="bar-val sof">${r.sofia > 0 ? r.sofia.toFixed(1) : '—'}</div>
        </div>
      </div>
    `;
  }).join('');
}

// Supabase setup
let db;
try {
  if (typeof SUPABASE_URL === 'undefined' || SUPABASE_URL === 'YOUR_SUPABASE_URL') throw new Error('config');
  db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch(e) {
  document.getElementById('errorBanner').style.display = 'block';
  document.getElementById('errorBanner').innerHTML =
    '<strong>⚠️ Supabase nicht konfiguriert</strong><br>Bitte <code>config.js</code> mit deinen Supabase-Zugangsdaten befüllen.';
}

async function loadVotes() {
  if (!db) return;
  const { data, error } = await db.from('votes').select('*');
  if (error) { console.error(error); return; }
  allVotes = data || [];
  renderResults();
}

// Initial load
loadVotes();

// Realtime subscription
if (db) {
  db.channel('votes-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'votes' }, () => loadVotes())
    .subscribe();
}
</script>
</body>
</html>
